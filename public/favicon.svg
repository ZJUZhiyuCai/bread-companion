<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 面包's silhouette on a toasted-crust tile: reads on light and dark tab bars alike, and keeps red
       for the phone. Same shape as public/brand/bread-mark.svg; no smile at this size, eyes open. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B9773F"/>
      <stop offset="1" stop-color="#8A4F26"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.26" cy="0.14" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fur" x1="0" y1="9" x2="0" y2="59" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF8EC"/>
      <stop offset="0.6" stop-color="#F5E3C6"/>
      <stop offset="1" stop-color="#E2BB88"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#tile)"/>
  <rect width="64" height="64" rx="15" fill="url(#sheen)"/>
  <g transform="translate(32 36) scale(0.86) translate(-32 -36)">
    <ellipse cx="33" cy="60.4" rx="21" ry="2.4" fill="#4A230C" opacity="0.4"/>
    <ellipse cx="22.5" cy="57.8" rx="6.2" ry="3.6" fill="#D5A46C"/>
    <ellipse cx="41.5" cy="57.8" rx="6.2" ry="3.6" fill="#D5A46C"/>
    <path d="M32.5 9 C35.5 12.5 41 18.5 45.5 26 C50.5 34.5 55 42 55 49.5 C55 56 47 59 32 59 C17 59 9 56 9 49.5 C9 42 13.5 34.5 18.5 26 C23 18.5 29.5 12.5 32.5 9 Z" fill="url(#fur)"/>
    <circle cx="23.4" cy="34" r="4.8" fill="#22140C"/>
    <circle cx="41.6" cy="34" r="4.8" fill="#22140C"/>
    <circle cx="21.9" cy="32.4" r="1.6" fill="#FFFFFF"/>
    <circle cx="40.1" cy="32.4" r="1.6" fill="#FFFFFF"/>
  </g>
</svg>
